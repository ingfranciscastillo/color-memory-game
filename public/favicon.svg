    <rect x="26" y="10" width="28" height="40" rx="4" fill="#ffffff" stroke="#1a1a1a" stroke-opacity="0.15"/>
    <rect x="29" y="13" width="22" height="24" rx="2" fill="#4338ca"/>
  </g>
  <g transform="rotate(-6 24 32)">
    <rect x="10" y="12" width="28" height="40" rx="4" fill="#ffffff" stroke="#1a1a1a" stroke-opacity="0.15"/>
    <rect x="13" y="15" width="22" height="24" rx="2" fill="#f2542d"/>
  </g>
</svg>
